<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>評価入力ai</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4fb;--card:#fff;--tx:#2a2540;--sub:#6b6585;--ac:#6c4ad0;--ac2:#efe9ff;--bd:#ddd6f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e2d;--tx:#eeeaf8;--sub:#a29cb8;--ac:#9d82f0;--ac2:#2f2745;--bd:#3a3350}}
:root[data-theme="dark"]{--bg:#17141f;--card:#221e2d;--tx:#eeeaf8;--sub:#a29cb8;--ac:#9d82f0;--ac2:#2f2745;--bd:#3a3350}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h1 span{color:var(--ac)}
.lead{color:var(--sub);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}h2 i{font-style:normal;background:var(--ac);color:#fff;border-radius:50%;display:inline-block;width:24px;height:24px;text-align:center;line-height:24px;font-size:13px;margin-right:6px}
textarea,input{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit;font-size:15px}
textarea{min-height:130px;resize:vertical}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer}
button.ghost{background:var(--ac2);color:var(--ac);padding:6px 12px;font-size:13px}
button:disabled{opacity:.5;cursor:wait}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--ac2);border-radius:12px;padding:8px 12px;font-size:14px}.tag b{color:var(--ac)}
.tag.off{opacity:.45}
.ex{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.ex h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex p{margin:0;white-space:pre-wrap;font-size:15px}
.num{display:grid;gap:8px;margin-bottom:10px}.num label{font-size:13px;color:var(--sub);display:block;margin-bottom:2px}
.msg{color:var(--sub);font-size:13px;margin:8px 0 0}
.err{color:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.out{white-space:pre-wrap;font-size:15px;border:1px dashed var(--ac);border-radius:12px;padding:12px;margin-top:10px}
.hide{display:none}
</style></head><body><main>
<h1>評価入力<span>ai</span></h1>
<p class="lead">コールセンター・バックオフィス業務向け。やったことを書くだけで、AIが成果の種類を判定し、自己評価の文例づくりまで手伝います。</p>

<section class="card"><h2><i>1</i>自分がやったこと</h2>
<label class="msg" style="margin:0 0 4px;display:block">あなたの役割</label>
<select id="role" style="width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit;font-size:15px;margin-bottom:10px">
<option>オペレーター（受電・架電）</option><option>SV・リーダー（オペレーター管理・育成）</option><option>バックオフィス・事務（入力・審査・集計など）</option><option>教育・品質管理（QA・研修・マニュアル）</option><option>その他</option></select>
<textarea id="did" placeholder="例：オペレーターからのエスカレーション対応の手順書を作り直した／毎月の集計作業をExcelの関数で自動化した／新人のモニタリングとフィードバックを担当した など、思いつくまま箇条書きでOK"></textarea>
<div class="row"><button id="go">AIで分析する</button></div>
<p class="msg" id="st"></p></section>

<section class="card hide" id="s2"><h2><i>2</i>AIによる成果の判定</h2>
<div class="tags" id="tags"></div><div id="reasons" class="msg"></div></section>

<section class="card hide" id="s3"><h2><i>3</i>自己評価に書く例</h2><div id="exs"></div></section>

<section class="card hide" id="s4"><h2><i>4</i>AIからの提案：この数字を入れると伝わります</h2>
<div class="num" id="nums"></div></section>

<section class="card hide" id="s5"><h2><i>5</i>ブラッシュアップ例</h2>
<p class="msg" style="margin-top:0">①の内容と④の数字をもとに、評価文を仕上げます。</p>
<div class="row"><button id="bu">ブラッシュアップする</button><button class="ghost hide" id="bu2">別の表現にする</button></div>
<div class="out hide" id="buout"></div>
<div class="row hide" id="cprow"><button class="ghost" id="cp">コピー</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
let sample=null,state={cats:[],ex:{},sug:[]};
const KINDS=["効率化","オペレーターとの関係性強化","安定化","標準化","応対品質・CS向上","教育・育成","ミス削減・リスク低減","部署間連携","コスト削減"];
const STYLES={formal:"しっかりとした書き方（客観的で自信と責任感のある文体）",desu:"です・ます調（丁寧で読みやすい）",stretch:"少し背伸びした表現（一段上の視点・影響範囲の広さ・主体性を感じさせる）"};
const NAMES={formal:"しっかりとした書き方",desu:"です・ます調",stretch:"少し背伸びした例"};
const BASE="あなたはコールセンターおよびバックオフィス部門の人事評価の自己評価を手伝うアシスタントです。想定する業務は、受電・架電、エスカレーション対応、モニタリング、シフト管理、オペレーター育成、マニュアル・FAQ整備、事務処理・入力・審査・集計などです。数字の提案には、AHT(平均処理時間)、応答率、放棄呼率、一次解決率(FCR)、応対品質スコア、CS・顧客満足度、エスカレーション件数、処理件数・処理時間、ミス・差戻し件数、残業時間、離職率・定着率、新人の独り立ち期間、マニュアル整備数などの現場KPIを優先してください。書き手は日本の会社で働く女性で、上司に提出する文章です。大げさな嘘や事実にないことは書かず、数字はユーザーが入力したものだけを使い、未入力の数字は「〇〇%」のように空欄の形で示します。";
(async()=>{try{sample=await claude.use("sample")}catch(e){}
if(!sample){$("st").textContent="※ この環境ではAI機能を使えません（Claudeのアプリ内で開いてください）";$("st").classList.add("err")}})();
async function ask(p){if(!sample)throw {message:"AI機能が使えません"};return sample.json(p,{cache:false})}
function busy(b,t){b.disabled=true;b._t=b.textContent;b.textContent=t||"考え中…"}
function free(b){b.disabled=false;b.textContent=b._t}
function err(e){$("st").textContent="うまくいきませんでした："+(e&&e.message||e)+"（もう一度お試しください）";$("st").classList.add("err")}

$("go").onclick=async()=>{
 const did=$("did").value.trim();if(!did){$("st").textContent="まず「やったこと」を入力してください";return}
 $("st").classList.remove("err");$("st").textContent="AIが分析中です（10〜60秒ほど）";busy($("go"),"分析中…");
 try{
  const r=await ask(BASE+`\n以下は本人の役割と「やったこと」です。\n役割：${$("role").value}\n---\n${did}\n---\n次のJSONのみ返してください。前置きやコードブロックは不要。\n{"cats":[{"name":"${KINDS.join("/")}のうち当てはまるもの(1〜3個、最も強いものから)","reason":"なぜそう言えるか1文"}],\n"ex":{"formal":"${STYLES.formal}の自己評価文(2〜4文)","desu":"${STYLES.desu}の自己評価文(2〜4文)","stretch":"${STYLES.stretch}の自己評価文(2〜4文)"},\n"sug":[{"label":"入力してほしい現場KPIの項目名(例:AHTの短縮秒数、月間の処理件数)","hint":"記入例や目安を短く"}] /* 3〜5個 */}`);
  state.cats=r.cats||[];state.ex=r.ex||{};state.sug=r.sug||[];
  render();$("st").textContent="分析が完了しました。下へスクロールしてください。";
 }catch(e){err(e)}finally{free($("go"))}
};
function render(){
 $("tags").innerHTML="";$("reasons").innerHTML="";
 const names=state.cats.map(c=>c.name);
 KINDS.forEach(k=>{const hit=names.includes(k);if(!hit&&k!==KINDS[0]&&k!==KINDS[1]&&k!==KINDS[2]&&k!==KINDS[3])return;
  const d=document.createElement("div");d.className="tag"+(hit?"":" off");d.innerHTML=hit?`<b>✔ ${k}</b>`:k;$("tags").appendChild(d)});
 state.cats.filter(c=>!KINDS.slice(0,4).includes(c.name)).forEach(c=>{});
 state.cats.forEach(c=>{const p=document.createElement("div");p.textContent="・"+c.name+"："+c.reason;$("reasons").appendChild(p)});
 $("exs").innerHTML="";
 Object.keys(STYLES).forEach(k=>{
  const w=document.createElement("div");w.className="ex";
  const h=document.createElement("h3");const s=document.createElement("span");s.textContent=NAMES[k];
  const b=document.createElement("button");b.className="ghost";b.textContent="更新（少し違う表現に）";
  h.append(s,b);const p=document.createElement("p");p.id="ex-"+k;p.textContent=state.ex[k]||"";
  b.onclick=async()=>{busy(b,"更新中…");try{
    const r=await ask(BASE+`\n本人の役割：${$("role").value}\n本人のやったこと：\n${$("did").value}\n\n判定された成果：${names.join("、")}\n現在の文章：\n${p.textContent}\n\n同じ内容で、言い回し・構成を変えた別の文章を作ってください。文体：${STYLES[k]}。2〜4文。{"text":"..."}のJSONのみ返してください。`);
    p.textContent=r.text;state.ex[k]=r.text}catch(e){err(e)}finally{free(b)}};
  const cb=document.createElement("button");cb.className="ghost";cb.textContent="コピー";cb.style.marginTop="8px";
  cb.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(p.textContent);cb.textContent="コピーしました";setTimeout(()=>cb.textContent="コピー",1200)};
  w.append(h,p,cb);$("exs").appendChild(w)});
 $("nums").innerHTML="";
 state.sug.forEach((s,i)=>{const d=document.createElement("div");
  const l=document.createElement("label");l.textContent=s.label+(s.hint?"　（"+s.hint+"）":"");
  const inp=document.createElement("input");inp.dataset.label=s.label;inp.placeholder="ここに数字を入力";
  d.append(l,inp);$("nums").appendChild(d)});
 ["s2","s3","s4","s5"].forEach(i=>$(i).classList.remove("hide"));
 $("buout").classList.add("hide");$("bu2").classList.add("hide");$("cprow").classList.add("hide");
}
async function brush(btn){
 const nums=[...document.querySelectorAll("#nums input")].filter(i=>i.value.trim()).map(i=>`・${i.dataset.label}：${i.value.trim()}`).join("\n")||"（数字は未入力）";
 busy(btn,"作成中…");
 try{
  const r=await ask(BASE+`\n本人の役割：${$("role").value}\n本人のやったこと：\n${$("did").value}\n\n成果の判定：${state.cats.map(c=>c.name).join("、")}\n本人が入力した数字：\n${nums}\n\n${$("buout").textContent?"前回とは構成と言い回しを変えて、":""}これらを踏まえ、自己評価として提出できる完成度の高い文章（です・ます調、250〜400字）を作ってください。流れは「取り組み→工夫→成果(数字)→今後」。{"text":"..."}のJSONのみ返してください。`);
  $("buout").textContent=r.text;$("buout").classList.remove("hide");$("bu2").classList.remove("hide");$("cprow").classList.remove("hide");
 }catch(e){err(e)}finally{free(btn)}
}
$("bu").onclick=()=>brush($("bu"));$("bu2").onclick=()=>brush($("bu2"));
$("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($("buout").textContent);$("cp").textContent="コピーしました";setTimeout(()=>$("cp").textContent="コピー",1200)};
</script></body></html>
